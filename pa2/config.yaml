# Configuração de treinamento (PA2) — por parte
# Edite este arquivo para mudar qualquer parâmetro.
# Uso: uv run pa2 0 | uv run pa2 1 | uv run pa2 2 | ...

# ── Comum ────────────────────────────────────────────────
seed: 42
output_dir: outputs

# ── Parte 0 — Testes sintéticos ───────────────────────────
parte0:
  synthetic: true
  data_dir: null
  n_sequences: 20
  n_frames: 45
  frame_size: 128
  n_objects_min: 5
  n_objects_max: 12
  occlusion_duration_min: 5
  occlusion_duration_max: 15
  velocity_scale: 1.0
  noise_level: 0.0
  contrast_scale: 1.0
  batch_size: 1
  num_workers: 0
  epochs: 5
  lr: 1.0e-3
  checkpoint: null
  eval_only: false
  detector_drop_rate: 0.0
  detector_noise: 0.0
  detector_fp_rate: 0.0

# ── Parte 1 — Baseline por quadro ─────────────────────────
parte1:
  synthetic: false
  data_dir: data/MOT17
  sequence_split:
    train: []
    val: []
    test: []
  detector_source: "SDP"
  use_torchvision_detector: false
  batch_size: 1
  num_workers: 0
  epochs: 0
  lr: 1.0e-3
  checkpoint: null
  eval_only: true
  association:
    method: "greedy"
    iou_threshold: 0.3
    max_age: 30
    min_hits: 3
    min_conf: null     # null = limiar de score que maximiza o F1 no treino (ver Parte 1)
    eval_iou: 0.5

# ── Parte 2 — Trilha A: RNN como modelo de movimento ─────
# Detecções congeladas (as mesmas da Parte 1: SDP, score >= limiar da Parte 1).
# Treino nas trajetórias do GT dos vídeos de treino; a validação escolhe a melhor época.
parte2:
  synthetic: false
  data_dir: data/MOT17
  sequence_split:
    train: []          # vazio = split padrão por vídeo (pa2/mot17/loader.py)
    val: []
    test: []
  detector_source: "SDP"
  use_torchvision_detector: false
  batch_size: 64
  num_workers: 0
  epochs: 30
  steps_per_epoch: 100
  lr: 2.0e-3
  checkpoint: null
  eval_only: false
  gradient_clipping: true
  grad_clip_value: 1.0
  rnn:
    type: "GRU"          # RNN | GRU | LSTM
    input_size: 10
    hidden_size: 64
    num_layers: 1
    dropout: 0.0
    use_delta_t: true
    predict_uncertainty: false
  association:           # a mesma regra da Parte 1: só muda o modelo de movimento
    method: "greedy"
    iou_threshold: 0.3
    max_age: 30
    min_hits: 3
    min_conf: null       # null = limiar de score da Parte 1 (maximiza o F1 no treino)
    eval_iou: 0.5
  window_T: 32
  teacher_forcing_ratio: 1.0
  gap_prob: 0.5
  max_gap: 20
  obs_noise: [0.06, 0.025, 0.08, 0.045]
  train_strides: [1]

# ── Parte 3 — Ablação: Eixo 2 (regime de treino) ─────────
# Mesmo modelo da Parte 2 (GRU 64) e mesma detecção congelada (SDP). O que varia é o regime de
# treino (ver `regimes`). Todos os regimes treinam o mesmo nº de épocas e o checkpoint é o da
# ÚLTIMA época (sem escolher a época pela validação). `gap_prob: 0` isola o efeito do regime:
# com buracos simulados o teacher forcing deixaria de ser puro. "part2_recipe" é a receita da
# Parte 2 (teacher forcing + buracos simulados) re-treinada sob o mesmo protocolo.
# Etapa 1 (essencial) = 4 primeiros regimes; etapa 2 = os 3 últimos.
parte3:
  synthetic: false
  data_dir: data/MOT17
  sequence_split:
    train: []
    val: []
    test: []
  detector_source: "SDP"
  batch_size: 64
  num_workers: 0
  epochs: 20
  steps_per_epoch: 100
  lr: 2.0e-3
  gradient_clipping: true
  grad_clip_value: 1.0
  rnn:
    type: "GRU"
    input_size: 10
    hidden_size: 64
    num_layers: 1
    dropout: 0.0
    use_delta_t: true
    predict_uncertainty: false
  association:         # a mesma regra das Partes 1 e 2
    method: "greedy"
    iou_threshold: 0.3
    max_age: 30
    min_hits: 3
    min_conf: null
    eval_iou: 0.5
  window_T: 32
  obs_noise: [0.06, 0.025, 0.08, 0.045]
  train_strides: [1]
  ablation:
    axis: "eixo2"
    seeds: [42, 123, 456]
    regimes:
      # ── etapa 1 ──
      - name: "teacher_forcing"          # só observações; nunca vê as próprias previsões
        teacher_forcing_ratio: 1.0
        gap_prob: 0.0
        gradient_clipping: true
      - name: "scheduled_sampling"       # prob. de observação decai linearmente de 1 a 0
        teacher_forcing_ratio: 1.0
        tf_schedule: "linear"
        tf_end: 0.0
        gap_prob: 0.0
        gradient_clipping: true
      - name: "free_running"             # só as próprias previsões (depois do 1º quadro)
        teacher_forcing_ratio: 0.0
        gap_prob: 0.0
        gradient_clipping: true
      - name: "free_running_no_clip"
        teacher_forcing_ratio: 0.0
        gap_prob: 0.0
        gradient_clipping: false
      # ── etapa 2 ──
      - name: "teacher_forcing_no_clip"
        teacher_forcing_ratio: 1.0
        gap_prob: 0.0
        gradient_clipping: false
      - name: "scheduled_sampling_no_clip"
        teacher_forcing_ratio: 1.0
        tf_schedule: "linear"
        tf_end: 0.0
        gap_prob: 0.0
        gradient_clipping: false
      - name: "part2_recipe"             # teacher forcing + buracos de observação simulados
        teacher_forcing_ratio: 1.0
        gap_prob: 0.5
        max_gap: 20
        gradient_clipping: true

# ── Parte 4 — Horizonte de memória, galeria de falhas e correção ──
# Usa o modelo final (checkpoint abaixo) e as detecções congeladas da Parte 1 (SDP).
parte4:
  synthetic: false
  data_dir: data/MOT17
  sequence_split:
    train: []
    val: []
    test: []
  detector_source: "SDP"
  checkpoint: outputs/checkpoints/final_motion_rnn.pt
  rnn:
    type: "GRU"
    hidden_size: 64
  association:           # a mesma regra das Partes 1 a 3
    method: "greedy"
    iou_threshold: 0.3
    max_age: 30
    min_hits: 3
    min_conf: null
    eval_iou: 0.5
  window_T: 32
  obs_noise: [0.06, 0.025, 0.08, 0.045]
